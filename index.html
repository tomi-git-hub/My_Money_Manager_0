<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>My Money Manager</title>
<style>
:root{--p:#0f766e;--p2:#14b8a6;--bg:#f1f5f9;--tx:#0f172a;--mut:#64748b;--red:#dc2626;--grn:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:14px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}
label{font-size:14px;color:var(--mut)}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:600;font-size:16px}
.btn:disabled{opacity:.6}
.btn.alt{background:#fff;color:var(--p);border:1px solid var(--p);margin-top:10px}
#splash{position:fixed;inset:0;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center;font:600 22px system-ui;z-index:99}
#auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;background:linear-gradient(160deg,var(--p),var(--p2))}
#auth .box{background:#fff;border-radius:20px;padding:24px}
#auth h1{margin:0 0 4px;font-size:26px}
#err{color:var(--red);font-size:14px;min-height:20px}
header{background:linear-gradient(160deg,var(--p),var(--p2));color:#fff;padding:18px 18px 70px;display:flex;justify-content:space-between;align-items:center}
header small{opacity:.8;display:block}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;padding:8px 14px;border-radius:20px}
main{margin-top:-52px;padding:0 16px 110px}
.hero{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:14px}
.hero small{color:var(--mut)}
.hero b{display:block;font-size:32px;color:var(--red);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat small{color:var(--mut);display:block}
.stat b{font-size:18px}
h3{margin:18px 0 10px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600}
.Pending{background:#fee2e2;color:var(--red)}
.Paid{background:#dcfce7;color:var(--grn)}
.bar{height:8px;background:#e2e8f0;border-radius:8px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p2)}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chips button{flex:1;padding:10px;border-radius:20px;border:1px solid #cbd5e1;background:#fff}
.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
.link{background:none;border:0;color:#fff;font-weight:600;font-size:16px;padding:8px 0}
.fab{position:fixed;right:20px;bottom:84px;width:58px;height:58px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:32px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e2e8f0}
nav button{flex:1;padding:14px;border:0;background:none;color:var(--mut);font-weight:600}
nav button.on{color:var(--p)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:10}
.sheet .in{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:92vh;overflow:auto}
.sheet img{max-width:100%;border-radius:12px;display:block;margin:0 auto 12px}
.shotbtn{background:none;border:1px solid var(--p);color:var(--p);border-radius:20px;padding:6px 14px;margin-top:8px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{background:#fff;border:1px solid #cbd5e1;color:var(--tx);border-radius:20px;padding:7px 14px;font-weight:600;font-size:14px}
.mini.del{color:var(--red);border-color:#fca5a5}
</style></head>
<body>

<div id="splash">My Money Manager</div>

<div id="auth" hidden>
 <div class="box">
  <h1>My Money Manager</h1>
  <p class="mut">Your private loan book</p>
  <label>Email</label><input id="email" type="email" autocomplete="email">
  <label>Password (6+ letters)</label><input id="pass" type="password" autocomplete="current-password">
  <div id="err"></div>
  <button class="btn" data-act="login">Log in</button>
  <button class="btn alt" data-act="signup">Create account</button>
 </div>
</div>

<div id="app" hidden>
 <header><div><small>Welcome</small><b id="who"></b></div><button data-act="logout">Log out</button></header>
 <main>
  <section id="v-home"><div id="dash"></div><h3>Recent loans</h3><div id="recent"></div></section>
  <section id="v-loans" hidden>
   <input id="q" placeholder="Search by person's name">
   <div class="chips"><button data-f="all" class="on">All</button><button data-f="Pending">Pending</button><button data-f="Fully Paid">Fully Paid</button></div>
   <div id="list"></div>
  </section>
  <section id="v-detail" hidden><button class="link" data-act="back">← Back</button><div id="det"></div></section>
 </main>
 <button class="fab" id="fab" data-act="add">+</button>
 <nav><button data-v="home" class="on">Home</button><button data-v="loans">Loans</button></nav>

 <div id="sheet" class="sheet" hidden><div class="in">
  <h3 id="s-title" style="margin-top:0">Add a Loan</h3>
  <label>Person's name</label><input id="f-name">
  <label>Amount borrowed (Rs.)</label><input id="f-amt" type="number" inputmode="numeric" min="1">
  <label>Date borrowed</label><input id="f-date" type="date">
  <label>Note (optional)</label><textarea id="f-note" rows="2"></textarea>
  <div id="f-err" style="color:#dc2626;min-height:20px"></div>
  <button class="btn" id="s-save" data-act="saveloan">Save Loan</button>
  <button class="btn alt" data-act="closesheet">Cancel</button>
 </div></div>

 <div id="psheet" class="sheet" hidden><div class="in">
  <h3 id="p-title" style="margin-top:0">Add Payment</h3>
  <p class="mut" id="p-info"></p>
  <label>Amount returned (Rs.)</label><input id="p-amt" type="number" inputmode="numeric" min="1">
  <label>Payment date</label><input id="p-date" type="date">
  <label>Payment method</label>
  <select id="p-method"><option>Online</option><option>Cash</option><option>Bank Transfer</option><option>Other</option></select>
  <label id="p-filelabel">Payment screenshot (optional)</label><input id="p-file" type="file" accept="image/*">
  <div id="p-err" style="color:#dc2626;min-height:20px"></div>
  <button class="btn" id="p-save" data-act="savepay">Save Payment</button>
  <button class="btn alt" data-act="closepay">Cancel</button>
 </div></div>

 <div id="vsheet" class="sheet" hidden><div class="in">
  <div id="v-body" class="mut">Loading...</div>
  <button class="btn alt" data-act="closeshot">Close</button>
 </div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, set, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBSGWZlIRFUGj_e79B7YEYBHvFkZM3GbR8",
  authDomain: "ai-app-2b2e4.firebaseapp.com",
  databaseURL: "https://ai-app-2b2e4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ai-app-2b2e4",
  storageBucket: "ai-app-2b2e4.firebasestorage.app",
  messagingSenderId: "820879079109",
  appId: "1:820879079109:web:6440087d12c14dd33922ac"
});
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
let uid = null, loans = {}, pays = {}, filter = "all", openId = null, unsubs = [], saving = false, cur = "home";
let editLoanId = null, editPayId = null;

const rs = n => "Rs. " + Number(n || 0).toLocaleString("en-PK");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d ? new Date(d + "T00:00").toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"}) : "";
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function calc(id, l) {
  const list = Object.entries(pays[id] || {}).map(([pid, p]) => ({ pid, ...p }));
  const returned = list.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const remaining = Math.max(0, l.amount - returned);
  return { returned, remaining, status: remaining <= 0 ? "Fully Paid" : "Pending", list };
}
const all = () => Object.entries(loans).map(([id, l]) => ({ id, ...l, ...calc(id, l) }))
  .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));

function loanCard(l) {
  const pct = l.amount ? Math.min(100, Math.round(l.returned / l.amount * 100)) : 0;
  return `<div class="card" data-act="open" data-id="${l.id}">
    <div class="row"><b>${esc(l.name)}</b><span class="badge ${l.status === "Pending" ? "Pending" : "Paid"}">${l.status}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row mut"><span>Borrowed ${rs(l.amount)}</span><span>Left ${rs(l.remaining)}</span></div></div>`;
}

function render() {
  const a = all();
  const borrowed = a.reduce((s, l) => s + l.amount, 0);
  const returned = a.reduce((s, l) => s + l.returned, 0);
  const pend = a.filter(l => l.status === "Pending").length;
  $("dash").innerHTML = `
   <div class="hero"><small>Total still owed</small><b>${rs(borrowed - returned)}</b></div>
   <div class="grid">
    <div class="stat"><small>Total borrowed</small><b>${rs(borrowed)}</b></div>
    <div class="stat"><small>Total returned</small><b>${rs(returned)}</b></div>
    <div class="stat"><small>Pending loans</small><b>${pend}</b></div>
    <div class="stat"><small>Fully paid loans</small><b>${a.length - pend}</b></div>
    <div class="stat"><small>Unpaid records</small><b>${pend}</b></div>
    <div class="stat"><small>All records</small><b>${a.length}</b></div>
   </div>`;
  $("recent").innerHTML = a.slice(0, 5).map(loanCard).join("") || `<p class="mut">No loans yet. Tap + to add one.</p>`;
  const q = $("q").value.trim().toLowerCase();
  const f = a.filter(l => (filter === "all" || l.status === filter) && l.name.toLowerCase().includes(q));
  $("list").innerHTML = f.map(loanCard).join("") || `<p class="mut">No records found.</p>`;
  if (openId) renderDetail();
}

function renderDetail() {
  const l = all().find(x => x.id === openId);
  if (!l) { $("det").innerHTML = "<p style='color:#fff'>Not found.</p>"; return; }
  const pl = l.list.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || 0) - (b.createdAt || 0));
  $("det").innerHTML = `<div class="card">
    <div class="row"><h2 style="margin:0">${esc(l.name)}</h2><span class="badge ${l.status === "Pending" ? "Pending" : "Paid"}">${l.status}</span></div>
    <p class="mut">Original loan: <b style="color:#0f172a">${rs(l.amount)}</b><br>Date: ${fmtDate(l.date)}${l.note ? "<br>Note: " + esc(l.note) : ""}</p>
    <div class="grid" style="margin:0 0 12px"><div class="stat"><small>Returned</small><b>${rs(l.returned)}</b></div><div class="stat"><small>Remaining</small><b>${rs(l.remaining)}</b></div></div>
    ${l.status === "Pending" ? `<button class="btn" data-act="addpay">Add Payment</button>` : `<p style="color:#16a34a;font-weight:600;margin:0">✓ Fully paid</p>`}
    <div class="acts"><button class="mini" data-act="editloan">Edit Loan</button><button class="mini del" data-act="delloan">Delete Loan</button></div>
   </div>
   <h3>Payment history</h3>
   ${pl.map((p, i) => `<div class="card"><div class="row"><b>Payment ${i + 1}</b><b>${rs(p.amount)}</b></div>
     <div class="mut">Date: ${fmtDate(p.date)}<br>Method: ${esc(p.method)}</div>
     <div class="acts">
       ${p.hasShot ? `<button class="shotbtn" style="margin:0" data-act="shot" data-pid="${p.pid}">View Screenshot</button>` : ""}
       <button class="mini" data-act="editpay" data-pid="${p.pid}">Edit</button>
       <button class="mini del" data-act="delpay" data-pid="${p.pid}">Delete</button>
     </div></div>`).join("") || `<p class="mut">No payments yet.</p>`}`;
}

/* Screens + Android back button */
function setView(v) {
  cur = v;
  if (v !== "detail") openId = null;
  ["home", "loans", "detail"].forEach(x => $("v-" + x).hidden = x !== v);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("fab").hidden = v === "detail";
  window.scrollTo(0, 0);
}
function nav(v) {
  if (v === cur) return;
  history.pushState({ s: v, sh: 0 }, "");
  setView(v);
}
function openSheet(id) {
  history.pushState({ s: cur, sh: id }, "");
  $(id).hidden = false;
}
function closeSheet(id) {
  if (!$(id).hidden) history.back();
}
window.addEventListener("popstate", e => {
  const st = e.state || { s: "home", sh: 0 };
  ["sheet", "psheet", "vsheet"].forEach(i => $(i).hidden = st.sh !== i);
  if ($("app").hidden) return;
  let v = st.s;
  if (v === "detail" && !openId) v = "loans";
  setView(v);
});

function stop() { unsubs.forEach(u => u()); unsubs = []; }
onAuthStateChanged(auth, user => {
  $("splash").hidden = true;
  stop();
  if (!user) {
    uid = null; loans = {}; pays = {};
    $("app").hidden = true; $("auth").hidden = false;
    ["sheet", "psheet", "vsheet"].forEach(i => $(i).hidden = true);
    return;
  }
  uid = user.uid;
  $("who").textContent = user.email;
  $("auth").hidden = true; $("app").hidden = false;
  history.replaceState({ s: "home", sh: 0 }, "");
  setView("home");
  unsubs.push(onValue(ref(db, `users/${uid}/loans`), s => { loans = s.val() || {}; render(); }));
  unsubs.push(onValue(ref(db, `users/${uid}/payments`), s => { pays = s.val() || {}; render(); }));
});

const msgs = {
  "auth/invalid-credential": "Wrong email or password.",
  "auth/email-already-in-use": "This email already has an account. Tap Log in.",
  "auth/weak-password": "Password must be 6 or more letters.",
  "auth/invalid-email": "Email is not correct.",
  "auth/network-request-failed": "No internet."
};
const authErr = e => $("err").textContent = msgs[e.code] || "Error: " + e.code;

function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.6));
    };
    img.onerror = () => rej(new Error("bad image"));
    img.src = url;
  });
}

async function savePayment() {
  if (saving) return;
  const err = $("p-err"); err.textContent = "";
  const l = all().find(x => x.id === openId);
  if (!l) return;
  const old = editPayId ? l.list.find(p => p.pid === editPayId) : null;
  const room = l.remaining + (old ? Number(old.amount) : 0);
  const amount = Math.round(Number($("p-amt").value)), date = $("p-date").value, method = $("p-method").value;
  if (!(amount > 0)) { err.textContent = "Please enter a correct amount."; return; }
  if (amount > room) { err.textContent = "Amount is more than the allowed " + rs(room) + "."; return; }
  if (!date) { err.textContent = "Please choose the date."; return; }
  saving = true; $("p-save").disabled = true; $("p-save").textContent = "Saving...";
  try {
    const file = $("p-file").files[0];
    if (old) {
      if (file) await set(ref(db, `users/${uid}/shots/${old.pid}`), await shrink(file));
      await update(ref(db, `users/${uid}/payments/${openId}/${old.pid}`), { amount, date, method, hasShot: !!file || !!old.hasShot });
    } else {
      const pref = push(ref(db, `users/${uid}/payments/${openId}`));
      if (file) await set(ref(db, `users/${uid}/shots/${pref.key}`), await shrink(file));
      await set(pref, { amount, date, method, hasShot: !!file, createdAt: Date.now() });
    }
    closeSheet("psheet");
  } catch (e) {
    err.textContent = "Could not save: " + (e.code || e.message);
  }
  saving = false; $("p-save").disabled = false; $("p-save").textContent = "Save Payment";
}

document.addEventListener("click", async e => {
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b === f)); render(); return; }
  const v = e.target.closest("[data-v]");
  if (v) { nav(v.dataset.v); return; }
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  $("err").textContent = "";
  if (act === "login") signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value).catch(authErr);
  if (act === "signup") createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value).catch(authErr);
  if (act === "logout") signOut(auth);
  if (act === "add") {
    editLoanId = null;
    $("s-title").textContent = "Add a Loan"; $("s-save").textContent = "Save Loan";
    ["f-name", "f-amt", "f-note"].forEach(i => $(i).value = ""); $("f-date").value = today(); $("f-err").textContent = ""; openSheet("sheet");
  }
  if (act === "editloan") {
    const l = all().find(x => x.id === openId); if (!l) return;
    editLoanId = l.id;
    $("s-title").textContent = "Edit Loan"; $("s-save").textContent = "Save Changes";
    $("f-name").value = l.name; $("f-amt").value = l.amount; $("f-date").value = l.date; $("f-note").value = l.note || "";
    $("f-err").textContent = ""; openSheet("sheet");
  }
  if (act === "delloan") {
    const l = all().find(x => x.id === openId); if (!l) return;
    if (!confirm("Delete the loan of " + l.name + " and all its payments? This cannot be undone.")) return;
    const u = {};
    u[`users/${uid}/loans/${l.id}`] = null;
    u[`users/${uid}/payments/${l.id}`] = null;
    l.list.forEach(p => { u[`users/${uid}/shots/${p.pid}`] = null; });
    try { await update(ref(db), u); history.back(); }
    catch (er) { alert("Could not delete: " + (er.code || er.message)); }
  }
  if (act === "closesheet") closeSheet("sheet");
  if (act === "open") { openId = t.dataset.id; nav("detail"); renderDetail(); }
  if (act === "back") history.back();
  if (act === "addpay") {
    const l = all().find(x => x.id === openId);
    editPayId = null;
    $("p-title").textContent = "Add Payment"; $("p-save").textContent = "Save Payment"; $("p-filelabel").textContent = "Payment screenshot (optional)";
    $("p-info").textContent = l.name + " · Remaining " + rs(l.remaining);
    $("p-amt").value = ""; $("p-file").value = ""; $("p-method").value = "Online";
    $("p-date").value = today(); $("p-err").textContent = ""; openSheet("psheet");
  }
  if (act === "editpay") {
    const l = all().find(x => x.id === openId);
    const p = l && l.list.find(x => x.pid === t.dataset.pid); if (!p) return;
    editPayId = p.pid;
    $("p-title").textContent = "Edit Payment"; $("p-save").textContent = "Save Changes";
    $("p-filelabel").textContent = p.hasShot ? "New screenshot (leave empty to keep the old one)" : "Payment screenshot (optional)";
    $("p-info").textContent = l.name + " · Can be up to " + rs(l.remaining + Number(p.amount));
    $("p-amt").value = p.amount; $("p-file").value = ""; $("p-method").value = p.method;
    $("p-date").value = p.date; $("p-err").textContent = ""; openSheet("psheet");
  }
  if (act === "delpay") {
    if (!confirm("Delete this payment? This cannot be undone.")) return;
    const pid = t.dataset.pid, u = {};
    u[`users/${uid}/payments/${openId}/${pid}`] = null;
    u[`users/${uid}/shots/${pid}`] = null;
    try { await update(ref(db), u); }
    catch (er) { alert("Could not delete: " + (er.code || er.message)); }
  }
  if (act === "closepay") closeSheet("psheet");
  if (act === "savepay") savePayment();
  if (act === "shot") {
    $("v-body").textContent = "Loading..."; openSheet("vsheet");
    try {
      const s = await get(ref(db, `users/${uid}/shots/${t.dataset.pid}`));
      if (s.exists()) { $("v-body").innerHTML = ""; const im = new Image(); im.src = s.val(); $("v-body").appendChild(im); }
      else $("v-body").textContent = "Screenshot not found.";
    } catch (er) { $("v-body").textContent = "Could not open. Check your internet."; }
  }
  if (act === "closeshot") closeSheet("vsheet");
  if (act === "saveloan") {
    const name = $("f-name").value.trim(), amount = Math.round(Number($("f-amt").value)), date = $("f-date").value;
    if (!name) { $("f-err").textContent = "Please enter the name."; return; }
    if (!(amount > 0)) { $("f-err").textContent = "Please enter a correct amount."; return; }
    if (!date) { $("f-err").textContent = "Please choose the date."; return; }
    const note = $("f-note").value.trim();
    try {
      if (editLoanId) {
        const l = all().find(x => x.id === editLoanId);
        if (l && amount < l.returned) { $("f-err").textContent = "Amount cannot be less than the " + rs(l.returned) + " already returned."; return; }
        await update(ref(db, `users/${uid}/loans/${editLoanId}`), { name, amount, date, note });
      } else {
        await push(ref(db, `users/${uid}/loans`), { name, amount, date, note, createdAt: Date.now() });
      }
      closeSheet("sheet");
    } catch (er) { $("f-err").textContent = "Could not save: " + (er.code || er.message); }
  }
});
$("q").addEventListener("input", render);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
